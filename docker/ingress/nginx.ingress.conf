# ==============================================================================
# ORSO AGENTS - PASSERELLE INGRESS REVERSE PROXY DYNAMIQUE (OPTION B)
# Routage multi-tenant Zero-Reload via résolveur DNS interne Docker (127.0.0.11)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. COCKPIT D'ADMINISTRATION & PILOTAGE COMMERCIAL (ops.orso-agents.fr)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ops.orso-agents.fr;

    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Tout le trafic sur ops.orso-agents.fr est relayé vers Olympe Core (Port 9230)
    # Olympe dessert l'API REST /api/olympe/* et l'application SPA Cockpit
    location / {
        set $olympe_upstream http://olympe-core:9230;
        proxy_pass $olympe_upstream;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}

# ------------------------------------------------------------------------------
# 2. PORTAIL CLIENT MULTI-TENANT UNIFIÉ (app.orso-agents.fr)
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost app.orso-agents.fr;

    # Sécurité & compression
    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Résolveur DNS interne Docker dynamique (TTL 10s, ipv6 désactivé)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Headers de proxy universels
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Routage vers le Superviseur Olympe (Port interne 9230)
    location /api/olympe/ {
        set $olympe_upstream http://olympe-core:9230;
        proxy_pass $olympe_upstream;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Accès direct éventuel au Cockpit Ops via sous-chemin /ops
    location /ops {
        set $olympe_upstream http://olympe-core:9230;
        proxy_pass $olympe_upstream;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Routage dynamique vers le WebSocket du client
    location ~ ^/t/(?<tenant>[a-zA-Z0-9_-]+)/ws/?$ {
        set $target_backend http://orso_client_$tenant:9119;
        proxy_pass $target_backend/ws;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Routage dynamique des APIs du conteneur client (SSE / Chat / Actions)
    location ~ ^/t/(?<tenant>[a-zA-Z0-9_-]+)/api/(.*)$ {
        set $target_backend http://orso_client_$tenant:9119;
        proxy_pass $target_backend/api/$2$is_args$args;

        # Streaming SSE mot à mot
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_read_timeout 3600s;
        proxy_connect_timeout 10s;

        proxy_intercept_errors on;
        error_page 502 504 = @tenant_offline;
    }

    # Gestionnaire en cas de conteneur éteint (Wake-on-demand)
    location @tenant_offline {
        default_type application/json;
        add_header Content-Type application/json always;
        return 503 '{"error": "TENANT_CONTAINER_OFFLINE", "tenant": "$tenant", "message": "L\'environnement de cet espace est actuellement en veille ou indisponible.", "wake_endpoint": "/api/olympe/tenants/wake/$tenant"}';
    }

    # Application cliente statique (PWA / SPA)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
