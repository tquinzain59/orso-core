# ==============================================================================
# Orso Agents - Configuration Reverse Proxy Nginx pour VPS OVH
# Environnement : PROD-FR-002 (Premier conteneur client)
# 
# Domaines :
# 1. UI Client    : https://prod-fr-002.orso-agents.fr       -> Port local 9300
# 2. Admin Hermès : https://admin.prod-fr-002.orso-agents.fr -> Port local 9229
#
# Pré-requis :
# - DNS : Entrées A chez le registrar pointant vers l'IP du VPS (92.222.68.80) :
#     prod-fr-002.orso-agents.fr       -> 92.222.68.80
#     admin.prod-fr-002.orso-agents.fr -> 92.222.68.80
# - Certificats SSL Let's Encrypt générés avec certbot :
#     certbot certonly --nginx -d prod-fr-002.orso-agents.fr -d admin.prod-fr-002.orso-agents.fr
# ==============================================================================

# ------------------------------------------------------------------------------
# Redirection HTTP vers HTTPS pour tous les sous-domaines
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name prod-fr-002.orso-agents.fr admin.prod-fr-002.orso-agents.fr;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 1. UI Client (PROD-FR-002) - PWA React / Vite
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name prod-fr-002.orso-agents.fr;

    ssl_certificate /etc/letsencrypt/live/prod-fr-002.orso-agents.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prod-fr-002.orso-agents.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Taille max de téléversement (ex: import CSV de factures)
    client_max_body_size 50M;

    # En-têtes de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Aiguillage vers le conteneur UI Client (qui gère l'UI et relaie /api/ et /ws au backend)
    location / {
        proxy_pass http://127.0.0.1:9300;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support WebSocket & SSE en continu
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ------------------------------------------------------------------------------
# 2. Administration Hermès (PROD-FR-002) - Dashboard & Supervision Moteur
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.prod-fr-002.orso-agents.fr;

    ssl_certificate /etc/letsencrypt/live/prod-fr-002.orso-agents.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prod-fr-002.orso-agents.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    # Sécurité renforcée pour l'espace d'administration
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Optionnel : restriction IP (décommenter pour n'autoriser que l'IP fixe d'administration)
    # allow 82.xxx.xxx.xxx;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:9229;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket & streaming terminal
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
