# ==============================================================================
# Orso Agents - Configuration Reverse Proxy Nginx pour VPS OVH (92.222.68.80)
# Sous-domaine : ops.orso-agents.fr -> Superviseur Olympe & Cockpit Ops (Port local 9230)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name ops.orso-agents.fr;

    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        proxy_pass http://127.0.0.1:9230;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
