name: Build and Publish Orso Engine to GHCR

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Étiquette de version humaine (ex: v1.0.0)'
        required: false
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-engine:
    name: Build & Publish Orso Engine to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/tquinzain59/orso-engine
          tags: |
            type=raw,value=${{ github.event.inputs.version_tag || 'v1.0.0' }}-${{ github.sha }}
            type=raw,value=release-${{ steps.date.outputs.date }}
            type=raw,value=latest

      - name: Build and Push Engine Image
        id: build_push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.orso
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Output Immutable Digest
        run: |
          echo "=================================================="
          echo "Image publiée avec succès :"
          echo "Repo   : ghcr.io/tquinzain59/orso-engine"
          echo "Digest : ${{ steps.build_push.outputs.digest }}"
          echo "=================================================="
