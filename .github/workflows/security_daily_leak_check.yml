name: Daily Production Secrets Leak Check (KAN-46 & KAN-49)

on:
  schedule:
    # Tous les jours à 03:00 UTC (heures creuses)
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-secrets-and-live-probes:
    name: Secrets Leak & Live Production Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # KAN-55 : l'audit d'historique exige l'historique complet (un clone
          # superficiel est refusé par le script, jamais ignoré en silence).
         fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests python-dotenv pyyaml
      # KAN-55 : coexiste avec le contrôle en clair ci-dessous (qui n'est pas retiré).
      # Historique audité par défaut : aucune option à passer. Tout constat => code 1.
      - name: Secrets Leak Check (arbre + historique)
        run: python scripts/security/check_no_secrets.py

      - name: Static Security Audit (Docs & Codebase)
        run: |
          python -c "
          import sys
          from pathlib import Path
          
          # 1. Vérification absence de fichiers interdits
          forbidden_files = ['Secrets/secrets_poc.md', 'admin.html', 'monitoring.html']
          for f in forbidden_files:
              if Path(f).exists():
                  print(f'::error:: Fichier interdit présent : {f}')
                  sys.exit(1)
                  
          # 2. Vérification de l'assainissement de guides_de_configuration.md
          guide = Path('docs/3_Technique/guides_de_configuration.md').read_text(encoding='utf-8')
          if 'scrypt$$16384$$' in guide:
              print('::error:: Hash scrypt exposé dans guides_de_configuration.md')
              sys.exit(1)
          if 'HERMES_DASHBOARD_BASIC_AUTH_USERNAME=\"admin\"' in guide:
              print('::error:: Username admin par défaut exposé dans guides_de_configuration.md')
              sys.exit(1)
              
          print('[✓] Audit statique de sécurité réussi : aucun hash ou identifiant par défaut.')
          "

      - name: Live URL Probe (Production Vitrine)
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://www.orso-agents.fr/Secrets/secrets_poc.md)
          echo "Status /Secrets/secrets_poc.md: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "404" ] && [ "$HTTP_STATUS" != "410" ]; then
            echo "::error:: Alerte critique : le fichier de secrets est accessible en production (HTTP $HTTP_STATUS) !"
            exit 1
          fi

      - name: Execute Security Conformance Tests
        run: |
          pytest tests/security/test_kan46_vitrine_security.py tests/security/test_check_no_secrets.py -v
