name: Daily Production Secrets Leak Check (KAN-46)

on:
  schedule:
    # Tous les jours à 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  audit-vitrine-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests python-dotenv

      - name: Execute Security Conformance Tests (KAN-46)
        run: |
          pytest tests/security/test_kan46_vitrine_security.py -v
